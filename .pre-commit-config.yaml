default_install_hook_types: [pre-commit]
default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock check
        entry: uv
        # --check only, not --upgrade: dependency bumps are Dependabot's job; --upgrade would re-resolve to
        # whatever is newest on PyPI at run time and fail later pushes with no code change involved.
        args: ["lock", "--check"]
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock)$'

      - id: uv-sync
        name: uv sync before hooks
        entry: uv
        args: ["sync"]
        language: system
        pass_filenames: false

      - id: uv-pyright
        name: pyright
        entry: uv
        args: ["run", "pyright"]
        language: system
        pass_filenames: false
        files: '\.pyi?$'

      - id: uv-ruff-check
        name: ruff lint & fix
        entry: uv
        args: ["run", "ruff", "check", "--fix"]
        language: system
        pass_filenames: false
        files: '\.pyi?$'

      - id: uv-ruff-format
        name: ruff format
        entry: uv
        args: ["run", "ruff", "format"]
        language: system
        pass_filenames: false
        files: '\.pyi?$'

      - id: uv-pytest
        name: pytest
        entry: uv
        # A few seconds: every JavaScript host that starts here (Node, and gi-jsc with PyGObject).
        args: ["run", "pytest", "-q"]
        language: system
        pass_filenames: false
        files: '(\.py|pyproject\.toml)$'
